# Local full-stack development environment for Docker Desktop.
# Runs the entire application: database, backend API, background worker, and frontend.
# Preserves Windows host PostgreSQL 17 untouched (internal port 5432 maps to 55433).
#
# Quickstart:
#   docker compose up --build -d     # Build and start all 4 services
#   docker compose ps                # Check health status
#   docker compose logs -f           # Follow container logs
#   docker compose down              # Stop all containers
# DEV ONLY (fixed dev secrets, ALLOW_MISSING_ORIGIN=true). Never run this file on a server: it shares the project name
# and container names of docker-compose.prod.yml (G-17). Production uses its own pinned subnets 172.29.10-30.0/24.
name: udigity

services:
  db:
    image: postgres:17-alpine
    container_name: udigity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: udigity_dev
      POSTGRES_USER: udigity_dev
      POSTGRES_PASSWORD: udigity_dev_local_only
      TZ: UTC
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - devdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udigity_dev -d udigity_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - udigity-net

  backend:
    build:
      context: .
      dockerfile: devops/backend.Dockerfile
    image: udigity-backend:latest
    container_name: udigity-backend
    restart: unless-stopped
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgres://udigity_dev:udigity_dev_local_only@db:5432/udigity_dev
      SESSION_SECRET: udigity_dev_session_secret_32chars_long_random_value
      APP_ORIGIN: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      POLICY_COMPANY_TIMEZONE: Asia/Beirut
      TOTP_ENC_KEY_ID: dev-only
      TRUST_PROXY: "true"
      ALLOW_MISSING_ORIGIN: "true"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - udigity-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: udigity-backend:latest
    container_name: udigity-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://udigity_dev:udigity_dev_local_only@db:5432/udigity_dev
      SESSION_SECRET: udigity_dev_session_secret_32chars_long_random_value
      POLICY_COMPANY_TIMEZONE: Asia/Beirut
      TOTP_ENC_KEY_ID: dev-only
      # Local email catcher (Owner 2026-11-05): every email lands in Mailpit at http://localhost:8025 and NOTHING
      # leaves this machine (Mailpit has no relay configured). Plain SMTP is allowed only because NODE_ENV=development.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_DEV_ALLOW_PLAINTEXT: "true"
      SMTP_FROM: hr@udigity.local
      EMAIL_ALLOW_REAL_SEND: "true"
      PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - udigity-net
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'dist/worker.js' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  mailpit:
    # Local-only inbox for the invitation / password-reset flows. UI: http://localhost:8025. No outbound relay.
    image: axllent/mailpit:v1.27.0@sha256:fb84cfb1c3a33007cfdee8ba5a77b8c6c894de5b1a368372ddc5c965cf5c0b6d
    container_name: udigity-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - udigity-net

  frontend:
    build:
      context: .
      dockerfile: devops/frontend.Dockerfile
      args:
        INTERNAL_API_URL: http://backend:5000
    image: udigity-frontend:latest
    container_name: udigity-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:5000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - udigity-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  devdata:

networks:
  udigity-net:
    driver: bridge
