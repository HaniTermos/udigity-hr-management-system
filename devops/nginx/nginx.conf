user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # --- client address behind the host's proxy (G-02) ----------------------------------------------------------
  # This nginx is published on 127.0.0.1 only; the only peer that can reach it is the host's existing proxy (nginx,
  # Apache, OpenLiteSpeed, Caddy, ...), which arrives from the Docker bridge gateway (172.29.20.1 with the pinned
  # subnet), from 127.0.0.1, or from another container network (172.16.0.0/12). X-Forwarded-For is believed ONLY when
  # the TCP peer is one of those addresses; real_ip_recursive then walks the header from the right and takes the first
  # address that is not trusted, so entries a client prepends cannot be spoofed as long as the outer proxy appends
  # (or overwrites) the real peer address (see devops/proxy/*.example). Everything below ($remote_addr, the rate-limit
  # keys, the access log, the X-Forwarded-For sent to the backend) then uses the real client address.
  # If the outer proxy runs on another machine or in a range outside these lines, add it here.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # --- access log without single-use secrets (G-13) --------------------------------------------------------------
  # Invitation and reset links are GET /reset-password?token=<secret>. The token value must never reach the log (or any
  # log shipper), so the request line and the Referer are logged with `token=` blanked. (The nginx error log can still
  # print a full request line when an upstream fails; it is rotated with the access log: 10 MB x 5.)
  map $request_uri $log_uri {
    default $request_uri;
    "~^(?<lu_head>[^?]*\?(?:[^#]*&)?(?:token|code|key)=)[^&#]*(?<lu_tail>.*)$" "${lu_head}[redacted]${lu_tail}";
  }
  map $http_referer $log_referer {
    default $http_referer;
    "~^(?<lr_head>[^?]*\?(?:[^#]*&)?(?:token|code|key)=)[^&#]*(?<lr_tail>.*)$" "${lr_head}[redacted]${lr_tail}";
  }
  log_format main '$remote_addr - [$time_local] "$request_method $log_uri $server_protocol" $status $body_bytes_sent '
                  '"$log_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 10m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  # --- gzip ---------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             application/xml image/svg+xml application/manifest+json;

  # --- rate limiting (outer flood guard; the BACKEND limiters are the primary, per-account/per-session control) ----
  # The whole company sits behind one office NAT: ~60 people share ONE client IP, so every per-IP number below is sized
  # for the office as a whole, never for one person. The precise limits (login attempts per account, per-session request
  # budget, lockout) live in the backend and always bite first; nginx only stops floods and stays out of the way.
  #
  # (1) auth: credential endpoints only (login, 2FA verify/recovery/enrol, password reset/change). Per client IP.
  #     60/min with burst 40: a morning where everyone logs in within ~5 min (60 logins + retries + 2FA codes, roughly
  #     2-3 requests per person) fits; a script guessing passwords is capped at 60 tries/min/IP, and the backend
  #     locks an account after 5 failures anyway. Logout, 2FA status and the session probe are NOT in this zone.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
  # (2) Session-keyed zones: one bucket per signed-in user (cookie value), falling back to the IP when there is no cookie.
  #     If you rename SESSION_COOKIE_NAME in backend.env, change the cookie name in this map too.
  map $http_cookie $session_limit_key {
    default                                       $binary_remote_addr;
    "~(?:^|;\s*)__Host-udigity_session=(?<sid>[^;]+)" "sid:$sid";
  }
  #     authsess: /api/auth/me, logout, 2fa/status, sessions/*: cheap calls that every open tab makes. 10/s, burst 30.
  limit_req_zone $session_limit_key zone=authsess:10m rate=10r/s;
  #     apisess: all other /api/ calls. A busy calling page polls ~1-1.5 req/s per tab (review F-03); 8/s with burst 60
  #     leaves room for 4+ tabs per user and stays above the backend budget of 2/s per session, so the backend answers first.
  limit_req_zone $session_limit_key zone=apisess:10m rate=8r/s;
  # (3) Per-IP safety nets for the whole office, because a client can forge a cookie value to get a fresh session bucket.
  #     apiip 150 r/s: ~60 users x ~1.5 polls/s = ~90 r/s sustained at peak plus bursts. webip 100 r/s: page loads,
  #     RSC fetches and prefetches (static assets under /_next/static/ are not counted).
  limit_req_zone $binary_remote_addr zone=apiip:10m  rate=150r/s;
  limit_req_zone $binary_remote_addr zone=webip:10m  rate=100r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;   # per-IP connection cap; see limit_conn in conf.d (sized for an office NAT)
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Single source for Referrer-Policy (see conf.d/security-headers.inc). Strictest on pages with reset tokens in the URL.
  map $uri $edge_referrer_policy {
    default                      "strict-origin-when-cross-origin";
    ~^/(reset-password|session-ended)(/|$) "no-referrer";
  }

  # Upstream keep-alive pool. proxy-common.inc currently sends `Connection: close` on non-upgrade requests (the websocket
  # map above), so nginx opens a fresh upstream connection per request and the idle-reuse race (sporadic 502) cannot occur
  # today. If you ever switch to `proxy_set_header Connection ""` for reuse, keep every upstream's keep-alive timeout above
  # nginx's (60 s here): the API sets keepAliveTimeout=75 s (backend/src/index.ts, F-09); Next's default is only 5 s, so set
  # KEEP_ALIVE_TIMEOUT>65000 on the frontend first.
  upstream backend  { server backend:5000;  keepalive 16; keepalive_timeout 60s; }
  upstream frontend { server frontend:3000; keepalive 16; keepalive_timeout 60s; }

  include /etc/nginx/conf.d/*.conf;
}
