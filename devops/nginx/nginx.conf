user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 10m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  # --- gzip ---------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             application/xml image/svg+xml application/manifest+json;

  # --- rate limiting (per client IP) ---------------------------------------
  # The backend also limits auth endpoints (AUTH_RATE_LIMIT_*); this is the outer guard.
  # Brute-force protection: login, 2FA, password reset/change. Keyed by client IP and strict on purpose.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # GET /api/auth/me is a cheap session probe that every open tab polls. An office behind one NAT shares one IP, so
  # it is keyed by the session cookie (one bucket per signed-in user), falling back to the IP without a cookie.
  # If you rename SESSION_COOKIE_NAME in backend.env, change the cookie name in this map too.
  map $http_cookie $session_limit_key {
    default                                       $binary_remote_addr;
    "~(?:^|;\s*)__Host-udigity_session=(?<sid>[^;]+)" "sid:$sid";
  }
  limit_req_zone $session_limit_key zone=authme:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_zone $binary_remote_addr zone=web:10m  rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;   # per-IP connection cap; see limit_conn in conf.d (sized for an office NAT)
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Single source for Referrer-Policy (see conf.d/security-headers.inc). Strictest on pages with reset tokens in the URL.
  map $uri $edge_referrer_policy {
    default                      "strict-origin-when-cross-origin";
    ~^/(reset-password|session-ended)(/|$) "no-referrer";
  }

  upstream backend  { server backend:5000;  keepalive 16; }
  upstream frontend { server frontend:3000; keepalive 16; }

  include /etc/nginx/conf.d/*.conf;
}
