# Edge for https://hrsystem.udigity.com (Owner decision S-28). Plain HTTP on purpose: this nginx is published on
# 127.0.0.1 only and the host's existing proxy terminates TLS, redirects http -> https and holds the certificate
# (devops/proxy/*.example). The proxy must forward the Host header unchanged.

# Anything that is not hrsystem.udigity.com (a direct IP, another host name) gets no answer at all. The container
# healthcheck (wget http://127.0.0.1/nginx-health) lands here.
server {
  listen 80 default_server;
  server_name _;
  access_log off;
  location = /nginx-health { default_type text/plain; return 200 "ok\n"; }
  location / { return 444; }
}

server {
  listen 80;
  server_name hrsystem.udigity.com;

  # Rate-limited requests get a JSON 429 the app can read (code RATE_LIMITED + Retry-After), not an HTML page.
  error_page 429 = @rate_limited;
  location @rate_limited {
    default_type application/json;
    add_header Retry-After 30 always;
    return 429 '{"error":"Too many requests. Please wait a moment and try again.","code":"RATE_LIMITED"}';
  }

  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  limit_conn perip 200;   # an office behind one NAT shares one IP

  # Health endpoints stay internal (compose healthchecks and the backup/ops tooling reach them on the internal
  # network). /health/worker is the worker heartbeat (J-09). prefix ^~ also covers /health/anything-else.
  location ~ ^/(healthz|readyz)/?$ { return 404; }
  location ^~ /health/ { return 404; }
  location = /health { return 404; }

  # Credential endpoints (F-01): login, 2FA verify/recover/enrol, password reset and change. Per client IP, sized for
  # an office behind one NAT (zone notes in nginx.conf); the backend limits per account and locks out guessing.
  # Regex locations win over the /api/auth/ prefix below, which is why logout, 2fa/status, me and sessions/* are
  # NOT throttled by this zone.
  location ~ ^/api/auth/(login|2fa/(verify|recover|enroll/.+|recovery-codes|enrollment-tokens)|password/.+|password-reset/.+)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=auth burst=40 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://backend;
  }

  # Everything else under /api/auth/ (me, logout, 2fa/status, sessions/*): cheap, polled by every open tab. Per session.
  location /api/auth/ {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=authsess burst=30 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://backend;
  }

  # Report exports (S-32: up to 10,000 rows, streamed). The query can take a while before the first byte and the download
  # runs at the client's speed, so this location gets longer timeouts than the 60 s default of proxy-common.inc (nginx's
  # read/send timeouts count the gap between two chunks, not the whole transfer). The body stays small (filters only); the
  # global client_max_body_size 10m applies. Same per-session and per-IP limits as the rest of /api/.
  location ^~ /api/reports/export {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=apisess burst=60 nodelay;
    limit_req zone=apiip burst=300 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;   # stream rows to the client as Express writes them instead of spooling a large file to the container FS (read-only)
    proxy_pass http://backend;
  }

  # API goes straight to Express (skips the Next rewrite hop). Per session first, per office IP as a flood net.
  location /api/ {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=apisess burst=60 nodelay;
    limit_req zone=apiip burst=300 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://backend;
  }

  # Immutable Next build assets (not rate limited: cacheable and cheap).
  location /_next/static/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://frontend;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=webip burst=200 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://frontend;
  }
}
