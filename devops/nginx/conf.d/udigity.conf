# Replace app.example.com with the real host name (must match APP_ORIGIN) before going live.

server {
  listen 80 default_server;
  server_name _;

  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  # ACME HTTP-01 challenge (certbot certonly --webroot -w devops/nginx/acme ...)
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.example.com;

  # --- TLS placeholders: real files are mounted from devops/nginx/certs ---
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  limit_conn perip 200;   # an office behind one NAT shares one IP

  # Health endpoints stay internal (compose healthchecks and the backup/ops tooling reach them on the internal
  # network). /health/worker is the worker heartbeat (J-09). prefix ^~ also covers /health/anything-else.
  location ~ ^/(healthz|readyz)/?$ { return 404; }
  location ^~ /health/ { return 404; }
  location = /health { return 404; }

  # Session probe: per-session limit (zone authme), NOT the per-IP auth zone, so many users behind one office IP
  # do not exhaust each other. Exact match wins over the /api/auth/ prefix below.
  location = /api/auth/me {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=authme burst=30 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://backend;
  }

  # Auth endpoints (login, 2FA, password reset/change, ...): strict per-IP limit, unchanged.
  location /api/auth/ {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://backend;
  }

  # API goes straight to Express (skips the Next rewrite hop).
  location /api/ {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://backend;
  }

  # Immutable Next build assets.
  location /_next/static/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://frontend;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    limit_req zone=web burst=60 nodelay;
    include /etc/nginx/conf.d/proxy-common.inc;
    proxy_pass http://frontend;
  }
}
